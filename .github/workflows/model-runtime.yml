name: Local Model native qualification

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish qualified packages from Main
        type: boolean
        default: false

concurrency:
  group: model-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15
            platform: darwin-arm64
          - runner: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tiangong-lca/platform
          ref: 69753a4bc9a42649dc6f8d42f430e6a785d10ae2
          path: method-cache
          sparse-checkout: public/lciamethods
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y libsuitesparse-dev libopenblas-dev liblapack-dev pkg-config cmake patchelf
      - name: Install Apple Silicon native build tools
        if: runner.os == 'macOS'
        run: brew install suite-sparse pkg-config cmake
      - name: Build, package and relocate on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 -m unittest scripts/test_package_model_runtime.py scripts/test_verify_model_release_assets.py
          cargo build --release --locked --bin model_calculate
          python3 scripts/collect_model_release_sources.py --engine target/release/model_calculate --output release-sources
          python3 scripts/package_model_runtime.py --engine target/release/model_calculate --static-cache method-cache/public --output model-package --notices release-sources/notices
          mkdir installed
          tar -xzf model-package/runtime.tar.gz -C installed
          python3 scripts/qualify_model_runtime.py --engine installed/bin/model_calculate --static-cache installed/cache --output qualification
      - uses: actions/checkout@v7
        if: runner.os == 'Windows'
        with:
          repository: microsoft/vcpkg
          ref: 5d4a3dc90c0b3773f3bac81bf41297b54328f471 # 2026.10.16
          path: native-vcpkg
          persist-credentials: false
      - name: Build, package and relocate on Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          & .\native-vcpkg\bootstrap-vcpkg.bat -disableMetrics
          & .\native-vcpkg\vcpkg.exe install suitesparse-umfpack:x64-windows
          $native = Join-Path $pwd 'native-vcpkg\installed\x64-windows'
          $env:SUITESPARSE_LIB_DIR = Join-Path $native 'lib'
          $env:PYTHONPATH = 'scripts'
          python -m unittest scripts/test_package_model_runtime.py scripts/test_verify_model_release_assets.py
          cargo build --release --locked --bin model_calculate
          $crt = Get-ChildItem (Join-Path $env:VCToolsRedistDir 'x64') -Directory -Filter 'Microsoft.VC*.CRT'
          if ($crt.Count -ne 1) { throw 'Expected one x64 MSVC redistributable directory' }
          python scripts/collect_model_release_sources.py --engine target/release/model_calculate.exe --output release-sources --vcpkg native-vcpkg
          python scripts/package_model_runtime.py --engine target/release/model_calculate.exe --library-dir "$native\bin" --library-dir $crt.FullName --static-cache method-cache/public --output model-package --notices release-sources/notices
          New-Item -ItemType Directory installed
          tar -xzf model-package/runtime.tar.gz -C installed
          python scripts/qualify_model_runtime.py --engine installed/bin/model_calculate.exe --static-cache installed/cache --output qualification
      - name: Assemble public release assets
        shell: bash
        env:
          MODEL_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir release-assets
          tar -czf "release-assets/model-runtime-${MODEL_PLATFORM}.tar.gz" -C model-package manifest.json runtime.tar.gz
          cp release-sources/sources.tar.gz "release-assets/model-runtime-${MODEL_PLATFORM}-sources.tar.gz"
          cp qualification/qualification.json "release-assets/model-runtime-${MODEL_PLATFORM}-qualification.json"
          python -c 'import json,os,pathlib; p=pathlib.Path("release-assets")/ ("model-runtime-"+os.environ["MODEL_PLATFORM"]+"-provenance.json"); p.write_text(json.dumps({"repository":os.environ["GITHUB_REPOSITORY"],"commit":os.environ["GITHUB_SHA"],"workflow":os.environ["GITHUB_WORKFLOW_REF"],"run":os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],"platform":os.environ["MODEL_PLATFORM"],"methodCacheCommit":"69753a4bc9a42649dc6f8d42f430e6a785d10ae2"},indent=2)+"\n")'
      - name: Preserve qualified packages and source evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-runtime-${{ matrix.platform }}-qualification
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: native-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish the exact qualified runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat model-runtime-version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="model-runtime-v${version}"
          mkdir downloads assets
          for platform in darwin-arm64 linux-x64 linux-arm64 win32-x64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "model-runtime-${platform}-qualification" --dir "downloads/${platform}"
            cp "downloads/${platform}/"* assets/
          done
          python3 scripts/verify_model_release_assets.py --directory assets --commit "$GITHUB_SHA"
          (cd assets && sha256sum * > SHA256SUMS)
          gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Local Model runtime ${version}" --notes "Installable local Model runtimes for macOS ARM64, Linux glibc 2.39+ x64/ARM64 and Windows x64. Extract the matching runtime archive and use tiangong-lca setup model-calculation --install <directory>. Corresponding source, notices, native numerical qualification, provenance receipts and SHA256SUMS accompany every platform. This release does not enable hosted computation." --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
